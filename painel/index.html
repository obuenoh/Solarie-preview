<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Solarie</title>
<meta name="description" content="Protótipo navegável do painel administrativo da Solarie Fine Jewelry.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500&family=Quicksand:wght@400;500;600&family=DM+Mono:wght@300;400;500&display=swap">

<style>
/* Identidade Solarie — areia, taupe, bronze. Tema claro único, por decisão do projeto.
   Cores de UI vêm do design-guide; as de DADO são derivadas mais escuras, porque a
   paleta da marca é dessaturada de propósito e não alcança o piso de gráfico.
   --ok foi re-derivado (#116A5C) para separar do ocre de alerta: ΔE 15.1 em visão
   normal e 8.3 em deuteranopia, ambos acima do piso. Todo status leva rótulo em texto. */
:root{
  --bg:#F1EFE9; --card:#FAF9F6; --card-2:#EAE8E0;
  --ink:#382A26; --ink-2:#5C5142; --ink-3:#756450;
  --rule:rgba(146,127,103,.30); --rule-2:rgba(146,127,103,.16);
  --brand:#8F6F42; --accent:#A3701F; --accent-w:#EDE8DC;
  --act:#1B5296;  --act-w:#DDE7F5;
  --crit:#C13B6A; --crit-w:#F4DCE3; --crit-ink:#8E2A4D;
  --warn:#8A6516; --warn-w:#F5EAD2;
  --ok:#116A5C;   --ok-w:#DBEAE5;
  --grid:rgba(146,127,103,.20);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Quicksand,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;font-weight:500}
h1,h2,h3,.wm,.kv{font-family:Urbanist,"Helvetica Neue",Arial,sans-serif}
.mono,th,.pill,.upd,.sku,.kk,.kd,.lab,.chip,.demo-strip,.hint,.axis text,.tip,.num,.bar-val,textarea.lista
  {font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.005em;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.demo-strip{background:var(--accent);color:#fff;text-align:center;padding:7px 16px;font-size:12px;letter-spacing:.05em}

/* ---------- shell ---------- */
.top{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:40}
.top-in{max-width:1240px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:34px;color:var(--ink)}
.brand .wm{font-size:14.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:300}
.brand .tagline{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  border-left:1px solid var(--rule);padding-left:12px;margin-left:4px;font-family:"DM Mono",monospace}
.top .right{margin-left:auto}
.upd{font-size:11.5px;color:var(--ink-3)}
.tabnav{border-bottom:1px solid var(--rule);background:var(--card);position:sticky;top:53px;z-index:39}
.tabs{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tabs a{padding:10px 13px;font-size:13.5px;color:var(--ink-3);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--accent)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:22px 20px 70px}

/* ---------- blocos ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:18px 20px;margin-bottom:16px}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.ch h2{font-size:16.5px}
.ch .q{font-size:13px;color:var(--ink-3);font-style:italic}
.chelp{font-size:13.5px;color:var(--ink-2);margin:0 0 15px}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:7px}
.hint{font-size:12px;color:var(--ink-3)}
.h1row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:24px}
.per{font-size:13px;color:var(--ink-3);font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------- filtros ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;background:var(--card);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule);font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:var(--card-2)}
.custom{display:none;gap:7px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:5px 9px}
.custom.on{display:flex}
.custom input{font-family:"DM Mono",monospace;font-size:12.5px;padding:4px 6px;background:var(--card-2);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
.custom span{font-size:12px;color:var(--ink-3)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:15px 17px}
.kk{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.kv{font-size:27px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kd{font-size:12.5px;margin-top:6px;color:var(--ink-3)}
.kd.up{color:var(--ok)} .kd.dn{color:var(--crit-ink)}

/* ---------- grafico ---------- */
.cw{position:relative;width:100%}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.axis text{font-size:10.5px;fill:var(--ink-3)}
.gl{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:8px 11px;font-size:12.5px;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap;
  box-shadow:0 1px 6px rgba(56,42,38,.10)}
.tip b{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-bottom:3px}

/* ---------- barras ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:12px;align-items:center}
.bar-row>div:first-child{min-width:0}
.bar-lab{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:9px;background:var(--rule-2);margin-top:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:0 2px 2px 0}
.bar-val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}

/* ---------- tabelas ---------- */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);text-align:left;
  padding:9px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;font-weight:600}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--accent)}
td{padding:9px 8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:500}
tfoot td{border-top:1px solid var(--rule);border-bottom:0;font-weight:600;padding-top:11px}
.pname{font-weight:600;line-height:1.3;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sku{font-size:11.5px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13.5px;padding:24px 0;text-align:center}
.th{width:40px;height:40px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;display:block;background:var(--card-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:var(--ok-w);color:var(--ok)}
.pill.warn{background:var(--warn-w);color:var(--warn)}
.pill.crit{background:var(--crit-w);color:var(--crit-ink)}
.pill.cal{background:var(--rule-2);color:var(--ink-2)}
.pill.act{background:var(--act-w);color:var(--act)}
.pill i{font-style:normal}

.fbtn{border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:2px;padding:6px 11px;font-size:12.5px}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn[aria-pressed="true"]{background:var(--accent-w);border-color:var(--accent);color:var(--accent);font-weight:600}
.fld{padding:8px 11px;font-size:14px;font-family:inherit;background:var(--card-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px}
.fld:focus{outline:2px solid var(--accent);outline-offset:1px}
select.fld{cursor:pointer}
.dark{padding:9px 17px;background:var(--ink);color:var(--bg);border:0;border-radius:2px;font-size:13.5px;font-weight:600;letter-spacing:.04em}
.dark:hover:not(:disabled){opacity:.87}
.dark:disabled{background:var(--rule-2);color:var(--ink-3);cursor:not-allowed}
textarea.lista{width:100%;margin-top:12px;padding:12px;font-size:12px;line-height:1.7;background:var(--card-2);
  color:var(--ink-2);border:1px solid var(--rule);border-radius:2px;resize:vertical}
.box{border-left:3px solid;padding:11px 14px;font-size:13.5px;line-height:1.5;margin:12px 0;border-radius:0 2px 2px 0}
.box.ok{background:var(--ok-w);border-color:var(--ok)}
.box.err{background:var(--crit-w);border-color:var(--crit)}
.box.warn{background:var(--warn-w);border-color:var(--warn)}
.box.info{background:var(--act-w);border-color:var(--act)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
footer{max-width:1240px;margin:0 auto;padding:0 20px 54px;font-size:12px;color:var(--ink-3);line-height:1.85;font-family:"DM Mono",monospace}
footer b{color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:520px){
  .top-in{padding:11px 14px}.brand .tagline{display:none}.tabnav{top:49px}
  main{padding:16px 14px 50px}.card{padding:15px 14px}h1{font-size:20px}.kv{font-size:23px}
}

/* ---------- Controle de Saídas ---------- */
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:940px){.sgrid{grid-template-columns:1fr}}
.desc{color:var(--ink-2);font-size:14.5px;max-width:66ch;margin:0 0 18px}
.origens{display:grid;grid-template-columns:repeat(auto-fit,minmax(194px,1fr));gap:10px}
.og{background:var(--card-2);border:1px solid var(--rule);border-radius:2px;padding:12px 13px;text-align:left;
  color:var(--ink);display:flex;flex-direction:column;gap:5px;transition:border-color .12s,background .12s}
.og:hover{border-color:var(--accent)}
.og[aria-pressed="true"]{background:var(--accent-w);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.og .on2{font-size:14.5px;font-weight:600;line-height:1.3}
.og .ow{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.pill.no{background:var(--rule-2);color:var(--ink-2)}
.pill.dn{background:var(--crit-w);color:var(--crit-ink)}
.pill.both{background:var(--warn-w);color:var(--warn)}
input.leitor{font-family:"DM Mono",monospace;font-size:16px;letter-spacing:.04em;width:100%}
.fld:disabled{opacity:.55;cursor:not-allowed}
.ac{position:relative;max-width:340px}
.aclist{position:absolute;z-index:30;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--rule);border-top:0;max-height:230px;overflow:auto}
.aclist button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;color:var(--ink);font-size:13.5px;border-bottom:1px solid var(--rule-2)}
.aclist button:hover{background:var(--accent-w)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{background:var(--card);border:1px dashed var(--rule);color:var(--ink-2);border-radius:2px;padding:5px 9px;font-size:11.5px}
.chip:hover:not(:disabled){border-color:var(--accent);border-style:solid;color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.prog{display:flex;align-items:center;gap:10px;margin-top:11px}
.ptrack{flex:1;height:7px;background:var(--rule-2);overflow:hidden;min-width:90px}
.pfill{height:100%;background:var(--accent);transition:width .25s}
.pnum{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pitems{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.pitem{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.pitem .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pq{font-family:"DM Mono",monospace;font-size:12.5px;white-space:nowrap}
tr.bad td{background:var(--crit-w)}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper button{width:25px;height:25px;line-height:1;background:var(--card-2);border:1px solid var(--rule);color:var(--ink);border-radius:2px;font-size:14px;padding:0}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.qt{min-width:32px;text-align:center;font-family:"DM Mono",monospace;font-size:14.5px;font-variant-numeric:tabular-nums;font-weight:500}
.lnk{background:none;border:0;color:var(--ink-3);font-size:11.5px;text-decoration:underline;padding:2px}
.lnk:hover{color:var(--crit-ink)}
.dirbtn{border:1px solid var(--rule);border-radius:2px;padding:3px 9px;font-size:11px;font-family:"DM Mono",monospace;font-weight:600}
.dirbtn[data-d="voltou"]{background:var(--ok-w);border-color:var(--ok);color:var(--ok)}
.dirbtn[data-d="saiu"]{background:var(--crit-w);border-color:var(--crit);color:var(--crit-ink)}
.efe{background:var(--card-2);border:1px solid var(--rule);border-radius:2px;padding:13px 15px;margin-top:14px}
.efe h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-family:"DM Mono",monospace;margin-bottom:9px;font-weight:600}
.efl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--rule-2)}
.efl:last-child{border-bottom:0}
.efl .d{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.d.up{color:var(--ok)} .d.dn{color:var(--crit-ink)} .d.zero{color:var(--ink-3)}
.foot{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--rule)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:12px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
textarea.fld{font-family:inherit;font-size:14px;resize:vertical;min-height:60px;width:100%}
.side{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:16px 17px;position:sticky;top:104px}
@media(max-width:940px){.side{position:static}}
.side h2{font-size:15.5px;margin-bottom:3px}
.mv{border-bottom:1px solid var(--rule-2)}
.mv:last-child{border-bottom:0}
.mvb{width:100%;background:none;border:0;text-align:left;padding:10px 2px;color:var(--ink);display:block}
.mvb:hover{background:var(--accent-w)}
.mvt{display:flex;align-items:baseline;gap:8px}
.mvt .h{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mvt .o{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvs{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mvd{padding:2px 2px 12px;font-size:12.5px;color:var(--ink-2)}
.mvd ul{list-style:none;margin:0 0 7px;padding:0}
.mvd li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--rule-2)}
.mvd .q{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.mvd .meta{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:90;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:2px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- canais ---------- */
.cnl{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:17px 19px}
.cnl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.cnl-h h2{font-size:16.5px}
.share{font-size:12px;color:var(--ink-3);font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.sharebar{height:6px;background:var(--rule-2);margin:9px 0 4px;overflow:hidden}
.sharefill{height:100%;background:var(--accent)}
.dl{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.dl:last-child{border-bottom:0}
.dl dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:"DM Mono",monospace}
.dl dd{margin:0;text-align:right}
.dl .v{font-size:20px;font-family:Urbanist,sans-serif;font-variant-numeric:tabular-nums}
.dl .d{font-size:12px;font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.dl .d.up{color:var(--ok)} .dl .d.dn{color:var(--crit-ink)}

/* ---------- notas ---------- */
.drop{border:1px dashed var(--rule);border-radius:2px;padding:22px;text-align:center;background:var(--card-2);margin-bottom:16px}
.drop p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.nlink{background:none;border:0;color:var(--accent);text-decoration:underline;font-size:14.5px;font-weight:600;padding:0;text-align:left}
.itg{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule-2);align-items:start}
.itg:last-child{border-bottom:0}
.itf{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-top:9px}
.itf label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:"DM Mono",monospace;margin-bottom:4px}
.itf input{width:100%;font-size:13.5px;padding:6px 8px}
.orig{font-size:12px;color:var(--ink-3);font-family:"DM Mono",monospace}
</style>
</head>
<body>


<div class="demo-strip">PROTÓTIPO · catálogo real de 402 peças · vendas e estoque simulados · nada é gravado</div>

<header class="top"><div class="top-in">
  <div class="brand">
    <svg viewBox="0 0 400 165" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M 158 150 A 42 42 0 0 1 242 150"/><line x1="155" y1="150" x2="82" y2="150"/><line x1="157.2" y1="136.1" x2="67.8" y2="107"/><line x1="163.6" y1="123.5" x2="72.2" y2="57.1"/><line x1="173.5" y1="113.6" x2="98.3" y2="10"/><line x1="186.1" y1="107.2" x2="143.6" y2="-23.7"/><line x1="200" y1="105" x2="200" y2="-36"/><line x1="213.9" y1="107.2" x2="256.4" y2="-23.7"/><line x1="226.5" y1="113.6" x2="301.7" y2="10"/><line x1="236.4" y1="123.5" x2="327.8" y2="57.1"/><line x1="242.8" y1="136.1" x2="332.2" y2="107"/><line x1="245" y1="150" x2="318" y2="150"/></g></svg>
    <span class="wm">Solarie</span><span class="tagline">Painel da loja</span>
  </div>
  <div class="right"><span class="upd" id="upd"></span></div>

/* ============ MODELO — histórico simulado, determinístico ============
   Um único gerador alimenta todas as abas, para que Visão geral, Produtos,
   Estoque, Reposição e Canais nunca se contradigam. */
const DIAS = 200;
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const dataDe = i => new Date(HOJE.getTime() - (DIAS-1-i)*864e5);

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mul(20260827);

/* popularidade: curva de Zipf sobre uma ordem embaralhada — a cabeça do
   catálogo gira, a cauda fica parada. É assim numa loja de semijoias. */
const ordem = CAT.map((_,i)=>i);
for(let i=ordem.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[ordem[i],ordem[j]]=[ordem[j],ordem[i]];}
CAT.forEach((p,i)=>{ p.k = +(p.p*(0.28+rnd()*0.16)).toFixed(2); });
ordem.forEach((pi,rank)=>{ CAT[pi].w = 1/Math.pow(rank+2.2, 1.05); });
const somaW = CAT.reduce((a,p)=>a+p.w,0);
CAT.forEach(p=>{ p.w/=somaW; });

/* estoque atual: cabeça com pouca peça (gira), cauda encalhada */
CAT.forEach((p,i)=>{
  const r=rnd();
  p.e = p.w > 1/somaW/Math.pow(60,1.05) ? Math.round(r*9) : Math.round(2+r*22);
});
const acum=[]; let s=0; CAT.forEach(p=>{s+=p.w;acum.push(s);});
const sorteia = () => { const r=rnd()*s; let lo=0,hi=acum.length-1;
  while(lo<hi){const m=(lo+hi)>>1; if(acum[m]<r) lo=m+1; else hi=m;} return lo; };

const PEDIDOS=[];
for(let d=0; d<DIAS; d++){
  const dow = dataDe(d).getDay();
  const fim = (dow===0||dow===6) ? 1.34 : (dow===1?.82:1);
  const cresc = 0.72 + 0.55*(d/DIAS);
  const n = Math.max(0, Math.round(11*fim*cresc*(0.62+rnd()*0.78)));
  for(let k=0;k<n;k++){
    const pos = rnd()<0.11;
    const qi = rnd(); const ni = qi<.58?1:qi<.87?2:3;
    const itens=[];
    for(let z=0;z<ni;z++){
      const pi=sorteia();
      const ex=itens.find(x=>x.pi===pi);
      if(ex) ex.q++; else itens.push({pi, q: rnd()<.88?1:2});
    }
    PEDIDOS.push({d,pos,itens});
  }
}

/* ---------- consultas ---------- */
const janela=(a,b)=>PEDIDOS.filter(o=>o.d>=a&&o.d<b);
function totais(ps){
  let rec=0,un=0,cus=0;
  for(const o of ps) for(const it of o.itens){
    const p=CAT[it.pi]; rec+=p.p*it.q; un+=it.q; cus+=p.k*it.q;
  }
  return {rec,un,cus,ped:ps.length,luc:rec-cus,tic:ps.length?rec/ps.length:0};
}
function unidadesPor(a,b){
  const m=new Map();
  for(const o of janela(a,b)) for(const it of o.itens) m.set(it.pi,(m.get(it.pi)||0)+it.q);
  return m;
}
function porProduto(a,b){
  const m=new Map();
  for(const o of janela(a,b)) for(const it of o.itens){
    const r=m.get(it.pi)||{un:0,rec:0,cus:0}; const p=CAT[it.pi];
    r.un+=it.q; r.rec+=p.p*it.q; r.cus+=p.k*it.q; m.set(it.pi,r);
  }
  return m;
}
const u30=()=>unidadesPor(DIAS-30,DIAS), u60=()=>unidadesPor(DIAS-60,DIAS), u90=()=>unidadesPor(DIAS-90,DIAS);

/* status de estoque — mesma regra do painel real (lib/metrics.ts) */
function statusDe(pi,U30,U60,U90){
  const st=CAT[pi].e, v30=U30.get(pi)||0, sp=v30/30;
  const cob = sp>0 ? st/sp : null;
  let s='Ok';
  if(st===0 && (U90.get(pi)||0)>0) s='Sem estoque';
  else if(cob!==null && cob<14) s='Repor';
  else if((U60.get(pi)||0)===0 && st>0) s='Parado';
  return {st,v30,sp,cob,s};
}

/* ---------- formatação ---------- */
const usd=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
const int=n=>Math.round(n).toLocaleString('pt-BR');
const pctT=n=>n===null?'—':`${n>=0?'+':''}${n.toFixed(1)}%`;
const varia=(a,b)=>b>0?((a-b)/b)*100:null;
const dm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const iso=d=>d.toISOString().slice(0,10);
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CORS={'Sem estoque':'crit','Repor':'warn','Parado':'cal','Ok':'ok'};

/* ---------- período ---------- */
let per={k:'30'};
function periodo(){
  if(per.k==='cus'&&per.a!=null) return {de:per.a,ate:per.b,dias:per.b-per.a+1,cus:true};
  const d={hoje:1,'7':7,'30':30,'90':90}[per.k]||30;
  return {de:DIAS-d,ate:DIAS-1,dias:d,cus:false};
}
function P(){const p=periodo();return {...p,from:p.de,to:p.ate+1,pf:p.de-p.dias,pt:p.de};}

function ligaPeriodo(){

    n.addEventListener('change',()=>{

      if(isNaN(i1)||isNaN(i2)||i2<i1) return;
      per={k:'cus',a:Math.max(0,i1),b:Math.min(DIAS-1,i2)}; rota();

const rotuloPer=()=>{const p=P();return `${dm(dataDe(p.de))} – ${dm(dataDe(p.ate))} · ${p.dias} ${p.dias===1?'dia':'dias'}`;};

/* ============ GRÁFICO — receita por dia, série única ============ */
function grafico(p){
  if(p.dias<3) return `<p class="box info">Período de ${p.dias} dia${p.dias>1?'s':''} — o gráfico de evolução aparece a partir de 3 dias.</p>`;
  const dias=[];
  for(let d=p.from; d<p.to; d++){
    let r=0; for(const o of PEDIDOS) if(o.d===d) for(const it of o.itens) r+=CAT[it.pi].p*it.q;
    dias.push({d,r});
  }
  const W=900,H=260,L=56,R=12,T=14,B=26;
  const max=Math.max(...dias.map(x=>x.r),1), top=Math.ceil(max/500)*500||500;
  const X=i=>L+(W-L-R)*(dias.length===1?.5:i/(dias.length-1));
  const Y=v=>T+(H-T-B)*(1-v/top);
  const linha=dias.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x.r).toFixed(1)}`).join('');
  const area=`${linha}L${X(dias.length-1).toFixed(1)},${Y(0)}L${X(0).toFixed(1)},${Y(0)}Z`;
  const grid=[0,.25,.5,.75,1].map(f=>{const v=top*f;return `<line class="gl" x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}"/>
    <text x="${L-9}" y="${Y(v)+3.5}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`}).join('');
  const passo=Math.max(1,Math.ceil(dias.length/7));
  const eixoX=dias.map((x,i)=>i%passo===0||i===dias.length-1
    ? `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${dm(dataDe(x.d))}</text>`:'').join('');
  return `<div class="cw" id="cw">
    <svg class="chart" id="lchart" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Receita por dia no período selecionado">
      <g class="axis">${grid}${eixoX}</g>
      <path d="${area}" fill="var(--accent)" opacity=".12"/>
      <path d="${linha}" fill="none" stroke="var(--accent)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(dias.length-1)}" cy="${Y(dias[dias.length-1].r)}" r="4"
              fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <line id="cross" x1="0" y1="${T}" x2="0" y2="${H-B}" stroke="var(--accent)"
            stroke-width="1" opacity="0"/>
      <circle id="cdot" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2" opacity="0"/>
      <rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip"></div></div>`;
}
function ligaGrafico(p){
  const svg=el('lchart'); if(!svg) return;
  const dias=[]; for(let d=p.from; d<p.to; d++){
    let r=0,n=0; for(const o of PEDIDOS) if(o.d===d){n++; for(const it of o.itens) r+=CAT[it.pi].p*it.q;}
    dias.push({d,r,n});
  }
  const W=900,H=260,L=56,R=12,T=14,B=26;
  const max=Math.max(...dias.map(x=>x.r),1), top=Math.ceil(max/500)*500||500;
  const X=i=>L+(W-L-R)*(dias.length===1?.5:i/(dias.length-1));
  const Y=v=>T+(H-T-B)*(1-v/top);
  const tip=el('tip'),cross=el('cross'),cdot=el('cdot'),cw=el('cw');
  const mover=ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((px-L)/((W-L-R)||1)*(dias.length-1));
    i=Math.max(0,Math.min(dias.length-1,i));
    const x=X(i),y=Y(dias[i].r);
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','.35');
    cdot.setAttribute('cx',x);cdot.setAttribute('cy',y);cdot.setAttribute('opacity','1');
    tip.innerHTML=`<b>${dm(dataDe(dias[i].d))}</b>${usd(dias[i].r)} · ${dias[i].n} pedido${dias[i].n===1?'':'s'}`;
    tip.style.opacity='1';
    const px2=x/W*cw.clientWidth;
    tip.style.left=Math.min(Math.max(px2-tip.offsetWidth/2,0),cw.clientWidth-tip.offsetWidth)+'px';
    tip.style.top=Math.max(0,y/H*cw.clientHeight-tip.offsetHeight-10)+'px';
  };
  svg.addEventListener('pointermove',mover);
  svg.addEventListener('pointerleave',()=>{tip.style.opacity='0';cross.setAttribute('opacity','0');cdot.setAttribute('opacity','0');});
}
const barras=(itens,fmt,escala)=>{
  const max=escala||Math.max(...itens.map(i=>i.v),1);
  return `<div class="bars">${itens.map(i=>`<div class="bar-row"><div>
    <div class="bar-lab" title="${esc(i.l)}">${esc(i.l)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,i.v/max*100)}%"></div></div>
  </div><div class="bar-val">${fmt(i.v)}</div></div>`).join('')}</div>`;
};

    const d=statusDe(pi,U30,U60,U90);

    return {pi,t:pr.t,s:pr.s,c:pr.c,preco:pr.p,custo:pr.k,mar,st:d.st,sta:d.s};
  });
  const cats=[...new Set(CAT.map(x=>x.c))].sort();

    <div class="tw"><table>

      <tbody>${vis.length?vis.map(r=>`<tr>
        <td><div class="pname" title="${esc(r.t)}">${esc(r.t)}</div><span class="sku">${r.c}</span></td>

/* ============ REPOSIÇÃO ============ */
function calcReposicao(){
  const U30=u30();
  const rows=[];
  CAT.forEach((pr,pi)=>{
    const st=pr.e, sp=(U30.get(pi)||0)/30;
    if(sp<=0) return;
    const cob=st/sp; if(cob>=30) return;
    const sug=Math.ceil(sp*60-st); if(sug<=0) return;
    rows.push({t:pr.t,sku:pr.s,st,sp,cob,sug,uc:pr.k,cus:sug*pr.k});
  });
  rows.sort((a,b)=>a.cob-b.cob);
  return {rows,total:rows.reduce((a,r)=>a+r.cus,0)};
}

    const sku=el('ms').value.trim(), qtd=Math.max(1,Math.round(Number(el('mq').value)||1));

function blocoCanal(nome,a,b,share,cmp,nota){
  const dl=(x,y)=>cmp?varia(x,y):null;
  const L=[['Faturamento',usd(a.rec),dl(a.rec,b.rec)],['Pedidos',int(a.ped),dl(a.ped,b.ped)],
           ['Ticket médio',usd(a.tic),dl(a.tic,b.tic)],['Unidades',int(a.un),dl(a.un,b.un)]];
  return `<div class="cnl">
    <div class="cnl-h"><h2>${nome}</h2><span class="share">${share.toFixed(1)}% do faturamento</span></div>
    <div class="sharebar"><div class="sharefill" style="width:${share}%"></div></div>
    <dl style="margin:8px 0 0">${L.map(([k,v,d])=>`<div class="dl"><dt>${k}</dt>
      <dd><div class="v">${v}</div><div class="d ${d===null?'':d>=0?'up':'dn'}">${pctT(d)}</div></dd></div>`).join('')}</dl>
    ${nota?`<p class="hint" style="margin:11px 0 0">${nota}</p>`:''}</div>`;
}
function vCanais(){
  const p=P();
  const at=janela(p.from,p.to), an=janela(p.pf,p.pt);
  const cmp=an.length>0;
  const pos=totais(at.filter(o=>o.pos)), onl=totais(at.filter(o=>!o.pos));
  const posA=totais(an.filter(o=>o.pos)), onlA=totais(an.filter(o=>!o.pos));
  const tot=pos.rec+onl.rec;
  return `<div class="h1row"><h1>Canais</h1><span class="per">${rotuloPer()}</span></div>
  ${barraPeriodo()}
  <div class="two">
    ${blocoCanal('Online',onl,onlA,tot?onl.rec/tot*100:0,cmp,'Pedidos entrados pela loja shopsolarie.com.')}
    ${blocoCanal('POS (presencial)',pos,posA,tot?pos.rec/tot*100:0,cmp,
      'Toda venda registrada em <b>Controle de Saídas</b> como “Venda presencial” cai aqui, porque vira pedido de verdade no Shopify.')}
  </div>
  <p class="hint">Comparação com ${dm(dataDe(Math.max(0,p.pf)))} – ${dm(dataDe(Math.max(0,p.pt-1)))}.
  ${cmp?'':'Sem pedidos nesse intervalo, então a variação aparece como “—”. '}
  Canal lido do pedido na Shopify.</p>`;
}

  if(MOVS) return;
  const f=k=>COMFOTO[k].p.s;
  MOVS=[
    {id:'m1',h:'09:42',o:'pedido',ped:'#SOL-1041',por:'Bruna',conf:'conferido',its:[[f(3),2],[f(9),1]]},

    return {...m,itens,val:m.o==='presencial'?itens.reduce((a,i)=>a+i.pr*i.q,0):null};
  });

const sPronto=()=>sOrigem!==null&&(sOrigem!=='pedido'||sPedido!==null);
const espDe=sku=>sPedido?sPedido.itens.filter(i=>i.sku===sku).reduce((a,i)=>a+i.q,0):0;
function sRevisar(){
  if(sOrigem!=='pedido'||!sPedido){sPecas.forEach(p=>p.est='ok');return;}
  sPecas.forEach(p=>{const e=espDe(p.sku);p.est=e===0?'fora':(p.q>e?'amais':'ok');});
}
function sConf(){
  if(sOrigem!=='pedido'||!sPedido) return null;
  const esp=sPedido.itens.reduce((a,i)=>a+i.q,0);
  const bip=sPecas.filter(p=>p.est==='ok').reduce((a,p)=>a+p.q,0);
  if(sPecas.some(p=>p.est==='fora')) return{e:'divergente',k:'err',t:'Peça incorreta: este produto não pertence ao pedido.',esp,bip};
  if(sPecas.some(p=>p.est==='amais')) return{e:'divergente',k:'err',t:'Quantidade divergente: foram bipadas mais unidades do que o pedido contém.',esp,bip};
  if(bip<esp) return{e:'faltou',k:'warn',t:`Falta uma peça: o pedido possui ${esp} itens, mas somente ${bip} foram bipados.`,esp,bip};
  return{e:'conferido',k:'ok',t:'Pedido conferido: todas as peças foram bipadas.',esp,bip};
}
const sDelta=p=>sOrigem==='troca'?(p.dir==='voltou'?p.q:-p.q):sOrigem==='pedido'?0:-Math.abs(p.q);

      <span class="hint">${ok?'':!sOrigem?'Escolha a origem.':(sOrigem==='pedido'&&!sPedido)?'Escolha o pedido.'
        :!uteis.length?'Bipe ao menos uma peça.'
        :bloq?'Confira o pedido ou marque a divergência.':!sQuem.trim()?'Informe quem confirmou.':''}</span>
    </div>
  </div></div>

  <aside><div class="side"><h2>Saídas registradas hoje</h2>
    <p class="hint" style="margin:0 0 10px">Clique para abrir as peças do movimento.</p>
    ${MOVS.length?MOVS.map(m=>{const n=m.itens.reduce((a,i)=>a+Math.abs(i.q),0),ab=sAberto===m.id;
      return `<div class="mv"><button class="mvb" data-mv="${m.id}" aria-expanded="${ab}">
        <span class="mvt"><span class="h">${m.h}</span><span class="o">${NOMEO[m.o]}</span>
          <span class="pill ${m.o==='pedido'?'cal':'act'}">${m.o==='pedido'?'não mexeu':'mexeu'}</span></span>
        <span class="mvs"><span>${m.ped||'—'}</span><span>${n} pç${m.val!=null?' · '+usd(m.val):''}</span></span></button>
      ${ab?`<div class="mvd"><ul>${m.itens.map(i=>`<li><span>${esc(i.t)}</span>
        <span class="q">${m.o==='troca'?(i.dir==='voltou'?'+':'−'):''}${Math.abs(i.q)}</span></li>`).join('')}</ul>
        <div class="meta">${m.conf?'conferência: '+m.conf+'<br>':''}${m.div?'divergência aceita<br>':''}
        ${m.just?'justificativa: '+esc(m.just)+'<br>':''}confirmado por ${esc(m.por)}</div></div>`:''}</div>`;}).join('')
      :'<p class="empty">Nenhuma saída hoje.</p>'}
  </div></aside></div>`;
}

function sBipar(cod){
  const p=achaSku(cod);
  if(!p){sMsg={k:'err',t:`Código não encontrado no catálogo: <b>${esc(cod)}</b>. A lista abaixo continua como estava.`};pinta();return;}
  const ex=sPecas.find(x=>x.sku===p.s);
  const futura=(ex?ex.q:0)+1;
  if(sOrigem==='presencial'&&futura>CAT[p.pi].e){
    sMsg={k:'err',t:CAT[p.pi].e===0?`Sem estoque disponível para <b>${p.s}</b>.`
      :`Estoque máximo atingido: só há ${CAT[p.pi].e} unidade(s) de <b>${p.s}</b> em estoque.`};
    pinta(); return;
  }
  if(ex) ex.q++; else sPecas.push({sku:p.s,pi:p.pi,t:p.t,img:p.i||null,pr:p.p,q:1,dir:'saiu',est:'ok'});
  sMsg=null; sRevisar(); pinta();
}
function ligaSaidas(){
  document.querySelectorAll('.og').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.o===sOrigem) return;
    if(sPecas.length&&!confirm('Trocar a origem limpa as peças já bipadas. Continuar?')) return;
    sOrigem=b.dataset.o;sPecas=[];sPedido=null;sAceita=false;sMsg=null;pinta();
    const c=el('cod'); if(c) c.focus();
  }));
  const ped=el('ped');
  if(ped){
    const abre=()=>{
      const t=ped.value.trim().replace(/^#/,'').toUpperCase();
      const hits=PEDIDOSABERTOS.filter(p=>p.n.toUpperCase().includes(t));
      el('acl').innerHTML=hits.map(p=>{const n=p.itens.reduce((a,i)=>a+i.q,0);
        return `<button type="button" data-p="${p.n}"><b>${p.n}</b> <span class="sku">${n} peça${n>1?'s':''}</span></button>`;}).join('');
      el('acl').hidden=!hits.length;
    };
    ped.addEventListener('input',()=>{sPedido=null;abre();});
    ped.addEventListener('focus',abre);
    el('acl').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;
      sPedido=PEDIDOSABERTOS.find(p=>p.n===b.dataset.p);sPecas=[];sAceita=false;sMsg=null;pinta();
      const c=el('cod');if(c)c.focus();});
  }
  const frm=el('frm');
  if(frm) frm.addEventListener('submit',e=>{e.preventDefault();
    const v=el('cod').value.trim(); if(!v||!sPronto())return; sBipar(v);});
  document.querySelectorAll('.chip[data-s]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)sBipar(b.dataset.s);}));
  document.querySelectorAll('[data-r],[data-m],[data-p2],[data-dir]').forEach(b=>b.addEventListener('click',()=>{
    const d=b.dataset;
    if(d.r) sPecas=sPecas.filter(p=>p.sku!==d.r);
    else if(d.m||d.p2){
      const p=sPecas.find(x=>x.sku===(d.m||d.p2));
      const emCap=d.p2&&sOrigem==='presencial'&&p.q>=CAT[p.pi].e;
      if(!emCap){ p.q+=d.m?-1:1; if(p.q<1)p.q=1; }
    }
    else if(d.dir){const p=sPecas.find(x=>x.sku===d.dir);p.dir=p.dir==='saiu'?'voltou':'saiu';}
    sRevisar();pinta();}));
  const q=el('quem'); if(q) q.addEventListener('input',()=>{sQuem=q.value;
    const p=q.selectionStart;pinta();const n=el('quem');n.focus();n.setSelectionRange(p,p);});
  const a=el('acc'); if(a) a.addEventListener('change',()=>{sAceita=a.checked;pinta();});
  document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{
    sAberto=sAberto===b.dataset.mv?null:b.dataset.mv;pinta();}));
  const c=el('conf');
  if(c) c.addEventListener('click',()=>{
    if(c.disabled||sEnviando) return;
    sEnviando=true; c.disabled=true; c.textContent='Confirmando…';
    setTimeout(()=>{
      const uteis=sPecas.filter(p=>p.q!==0), cf=sConf();
      /* o estoque do catálogo muda de verdade — Estoque, Produtos e Reposição refletem */
      uteis.forEach(p=>{CAT[p.pi].e=Math.max(0,CAT[p.pi].e+sDelta(p));});
      /* venda presencial entra no histórico como pedido POS de hoje */
      if(sOrigem==='presencial') PEDIDOS.push({d:DIAS-1,pos:true,itens:uteis.map(p=>({pi:p.pi,q:p.q}))});
      const ag=new Date();
      MOVS.unshift({id:'m'+Date.now(),
        h:String(ag.getHours()).padStart(2,'0')+':'+String(ag.getMinutes()).padStart(2,'0'),
        o:sOrigem, ped:sOrigem==='pedido'?sPedido.n:(sOrigem==='presencial'?'#SOL-'+(1049+MOVS.length):null),
        por:sQuem.trim(), conf:cf?cf.e:null, div:!!(cf&&cf.e!=='conferido'&&sAceita),
        just:null,
        itens:uteis.map(p=>({sku:p.sku,t:p.t,img:p.img,q:p.q,dir:p.dir,est:p.est,pr:p.pr})),
        val:sOrigem==='presencial'?uteis.reduce((a,p)=>a+p.pr*p.q,0):null});
      toast(sOrigem==='pedido'?'Pedido conferido. Estoque não foi tocado.'
          :sOrigem==='presencial'?'Venda registrada. O Shopify desconta as peças.'
          :'Movimento registrado. Estoque atualizado.');
      sPecas=[];sPedido=null;sAceita=false;sEnviando=false;sMsg=null;
      pinta(); const cc=el('cod'); if(cc) cc.focus();
    },520);
  });
}
function toast(t){const n=el('toast');n.textContent=t;n.classList.add('on');
  clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),3400);}
